<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Планер</title>
<meta name="description" content="Личный учебный планер: пары, задачи, хвосты">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#070405">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Планер">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>window.supabase||document.write('<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"><\/script>')</script>
<style>
html{padding-top:env(safe-area-inset-top,0px);color-scheme:dark;background:#070405}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: iOS-style grouped lists in one centered column, large titles, blurred bottom tab bar, bottom sheets for editing */
:root{
  /* Black & bordeaux — a single dark look, same in light and dark system mode */
  --bg:#070405; --card:#150A0D; --card2:#231217; --fg:#F8EEF0;
  --fg2:rgba(248,226,231,.58); --fg3:rgba(248,226,231,.28); --sep:rgba(255,190,205,.10);
  --fill:rgba(200,40,72,.13); --fill2:rgba(200,40,72,.26);
  --accent:#D3304E; --accent2:#FF6B83; --wine1:#1A0208; --wine2:#6E0F22; --onaccent:#FFFFFF;
  --red:#FF4D57; --orange:#FF9F0A; --green:#30D158; --indigo:#5E5CE6;
  --teal:#40C8E0; --pink:#FF375F; --purple:#BF5AF2; --yellow:#FFD60A; --brown:#AC8E68; --plum:#B35A9E;
  --gray:#5A4A4F;
  --bar:rgba(7,4,5,.86); --sheet:#110709; --shadow:none; --scrim:rgba(0,0,0,.66);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI Variable Text","Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-display:var(--font);
  --font-round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.3;letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{max-width:680px;margin:0 auto;padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}
.tnum{font-variant-numeric:tabular-nums}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-inline:-16px;padding-inline:16px;
  background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid transparent;transition:border-color .2s}
.nav.scrolled{border-bottom-color:var(--sep)}
.nav .small{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap}
.nav.scrolled .small{opacity:1}
.navbtn{color:var(--accent);font-size:17px;display:inline-flex;align-items:center;gap:4px;min-height:44px;padding-inline:4px}
.navbtn svg{width:22px;height:22px}
.plus{width:34px;height:34px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:var(--onaccent);box-shadow:0 4px 12px -4px color-mix(in srgb,var(--accent) 70%,transparent)}
.plus:active{transform:scale(.94)}
.plus svg{width:18px;height:18px}
.large{font-size:34px;font-weight:700;letter-spacing:.01em;line-height:1.15;margin:4px 0 2px;text-wrap:balance}
.large::after{content:"";display:block;width:28px;height:3px;border-radius:2px;background:var(--accent);margin-top:8px}
.subtitle{color:var(--fg2);font-size:15px;margin:0 0 14px;text-transform:none}
.banner{background:var(--card);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--fg2);margin-bottom:16px}

/* sections & lists */
.section{margin-top:22px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:0 4px 7px}
.sh h2{font-size:20px;font-weight:700;margin:0;letter-spacing:.01em}
.sh .cap{font-size:13px;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em}
.sh .link{color:var(--accent);font-size:15px}
.cap-h{font-size:13px;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em;padding:0 16px 7px;margin:0}
.list{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 .5px var(--sep)}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:44px;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);border-top:.5px solid var(--sep)}
.row.tap:active{background:var(--fill)}
.row .main{flex:1;min-width:0}
.row .t{font-size:17px;overflow-wrap:anywhere}
.row .s{font-size:14px;color:var(--fg2);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.row .end{color:var(--fg2);font-size:15px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chev{width:8px;height:13px;color:var(--fg3);flex:none}
.empty{background:var(--card);border-radius:12px;padding:22px 18px;text-align:center;color:var(--fg2);font-size:15px;line-height:1.45}
.empty b{display:block;color:var(--fg);font-size:17px;font-weight:600;margin-bottom:4px}
.empty button{margin-top:10px;color:var(--accent);font-size:15px;font-weight:600}
.foot{font-size:13px;color:var(--fg2);padding:7px 16px 0;line-height:1.4}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--card);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;box-shadow:inset 0 0 0 .5px var(--sep)}
.tile .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff}
.tile .ic svg{width:17px;height:17px}
.tile{flex-direction:row;align-items:center;gap:10px}
.tile .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .n{font-size:24px;font-weight:700;font-family:var(--font-round);line-height:1}
.tile .l{font-size:14px;color:var(--fg2);font-weight:500}
.tile:active{opacity:.7}

/* now card */
.now{background:var(--card);border-radius:14px;padding:14px 16px;display:flex;gap:14px;align-items:stretch;box-shadow:var(--shadow);margin-top:18px}
.now .cap2{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.now .ttl{font-size:20px;font-weight:600;margin:3px 0 4px;overflow-wrap:anywhere}
.now .meta{color:var(--fg2);font-size:15px}
.now .bar{flex:none;width:4px;border-radius:2px}
.prog{height:4px;border-radius:2px;background:var(--fill);margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:2px}

/* lesson row */
.time{width:52px;flex:none;font-size:15px;font-weight:600;line-height:1.25}
.time small{display:block;color:var(--fg2);font-weight:400;font-size:13px}
.pill{width:4px;align-self:stretch;border-radius:2px;flex:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--fg2)}
.badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.b-red{color:var(--red);background:color-mix(in srgb,var(--red) 14%,transparent)}
.b-orange{color:var(--orange);background:color-mix(in srgb,var(--orange) 16%,transparent)}
.b-green{color:var(--green);background:color-mix(in srgb,var(--green) 15%,transparent)}
.b-blue{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.b-plum{color:var(--plum);background:color-mix(in srgb,var(--plum) 14%,transparent)}
.b-gray{color:var(--fg2);background:var(--fill)}
.clip{width:14px;height:14px;color:var(--fg2)}

/* check */
.check{width:24px;height:24px;border-radius:50%;border:1.6px solid var(--fg3);flex:none;display:grid;place-items:center;transition:.15s}
.check svg{width:14px;height:14px;color:#fff;opacity:0}
.check.on{background:var(--accent);border-color:var(--accent)}
.check:not(.on):hover{border-color:var(--accent)}
.check.on svg{opacity:1}
.check.imp{border-color:var(--orange)}
.done .t{color:var(--fg2);text-decoration:line-through}

/* week strip */
.week{background:var(--card);border-radius:14px;padding:10px 8px 12px;box-shadow:var(--shadow)}
.week-h{display:flex;justify-content:space-between;align-items:center;padding:0 6px 8px}
.week-h .m{font-weight:600;font-size:17px;text-transform:capitalize}
.week-h .arr{display:flex;gap:2px}
.week-h .arr button{width:36px;height:36px;display:grid;place-items:center;color:var(--accent);border-radius:50%}
.week-h .arr button:active{background:var(--fill)}
.week-h .arr svg{width:12px;height:18px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 0}
.day .wd{font-size:12px;color:var(--fg2);font-weight:600;text-transform:uppercase}
.day .dn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-family:var(--font-round)}
.day.today .dn{color:var(--accent);font-weight:700}
.day.sel .dn{background:var(--fill2);color:var(--fg);font-weight:600;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 55%,transparent)}
.day.sel.today .dn{background:var(--accent);color:var(--onaccent)}
.day .mk{display:flex;gap:3px;height:5px}
.day .mk i{width:5px;height:5px;border-radius:50%;background:var(--fg3)}
.todaybtn{color:var(--accent);font-size:15px;font-weight:600;padding:4px 8px}

/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{font-size:14px;font-weight:500;padding:6px 8px;border-radius:7px;min-height:30px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--onaccent);box-shadow:0 2px 8px -2px rgba(211,48,78,.55);font-weight:600}


/* ring */
.ringcard{background:var(--card);border-radius:14px;padding:16px;display:flex;gap:16px;align-items:center;box-shadow:var(--shadow)}
.ring{width:72px;height:72px;flex:none}
.ringcard .big{font-size:22px;font-weight:700;font-family:var(--font-round)}
.ringcard .sm{color:var(--fg2);font-size:15px;margin-top:2px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--fg2);font-size:10.5px;font-weight:500;padding:2px 0;position:relative}
.tab svg{width:26px;height:26px}
.tab[aria-selected="true"]{color:var(--accent)}
.tab .cnt{position:absolute;top:-2px;left:calc(50% + 6px);background:var(--accent);color:#fff;font-size:11px;font-weight:600;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;transition:opacity .25s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:calc(100% - env(safe-area-inset-top,0px) - 12px);background:var(--sheet);border-radius:14px 14px 0 0;
  display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.25,1);max-width:680px;margin:0 auto;box-shadow:0 -8px 40px rgba(0,0,0,.18)}
.sheet.show{transform:none}
.sheet-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:56px;padding:6px max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px));position:relative}
.sheet-h::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:5px;border-radius:3px;background:var(--fill2);transform:translateX(-50%)}
.sheet-h .ttl{font-weight:600;font-size:17px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.sheet-h .r{justify-self:end}
.sheet-h .l{justify-self:start}
.sheet-h .navbtn.b{font-weight:600}
.sheet-h .navbtn[disabled]{color:var(--fg3)}
.sheet-b{overflow:auto;-webkit-overflow-scrolling:touch;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
.sheet-b .grp{display:flex;flex-direction:column}

/* form */
.f{background:var(--card);border-radius:12px;overflow:hidden}
.fr{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:46px;position:relative}
.fr+.fr::before{content:"";position:absolute;top:0;right:0;left:16px;border-top:.5px solid var(--sep)}
.fr label{flex:none;min-width:96px;font-size:17px}
.fr input,.fr select,.fr textarea{flex:1;min-width:0;font:inherit;font-size:17px;color:var(--fg);background:transparent;border:0;outline:none;padding:11px 0;text-align:right}
.fr input::placeholder,.fr textarea::placeholder{color:var(--fg3)}
.fr.full input,.fr.full textarea{text-align:left}
.fr textarea{min-height:110px;resize:vertical;line-height:1.4}
.fr input[type="date"],.fr input[type="time"]{-webkit-appearance:none;appearance:none;text-align:right;min-height:30px}
.fr input[type="date"]::-webkit-date-and-time-value,.fr input[type="time"]::-webkit-date-and-time-value{text-align:right}
.fr .seg{flex:1}
.fr.col{flex-direction:column;align-items:stretch;padding:10px 16px;gap:8px}
.danger{color:var(--red);font-size:17px;width:100%;min-height:46px;background:var(--card);border-radius:12px}
.plainbtn{color:var(--accent);font-size:17px;width:100%;min-height:46px;background:var(--card);border-radius:12px}
.drop{border:1.5px dashed var(--fg3);border-radius:12px;padding:16px;text-align:center;color:var(--fg2);font-size:15px;line-height:1.4;background:var(--card)}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--card))}
.drop b{color:var(--accent);font-weight:600}
.drop input{display:none}
.att{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:52px;position:relative}
.att+.att::before{content:"";position:absolute;top:0;right:0;left:60px;border-top:.5px solid var(--sep)}
.fi{width:32px;height:40px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700;flex:none;letter-spacing:.02em}
.att .main{flex:1;min-width:0}
.att .nm{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .sz{font-size:13px;color:var(--fg2)}
.att button{color:var(--accent);font-size:15px;white-space:nowrap}
.att .x{color:var(--red)}
.attw{position:relative}
.attw+.attw::before{content:"";position:absolute;top:0;right:0;left:0;border-top:6px solid var(--sheet)}
.attw .fr{min-height:40px}
.attw .fr::before{content:"";position:absolute;top:0;right:0;left:16px;border-top:.5px solid var(--sep)}
.attw .fr input,.attw .fr textarea{font-size:16px;padding:9px 0}
.attw .fr textarea{min-height:64px}
.fnote{font-size:15px;color:var(--fg2);margin:6px 4px 0;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.fnote b{color:var(--fg);font-weight:600}

/* detail */
.dhead{display:flex;flex-direction:column;gap:6px}
.dhead h3{font-size:24px;font-weight:700;margin:0;line-height:1.2;overflow-wrap:anywhere;text-wrap:balance}
.meta-grid{background:var(--card);border-radius:12px}
.doc{background:var(--card);border-radius:12px;padding:16px 18px;font-size:16px;line-height:1.5;overflow-wrap:anywhere}
.doc h1,.doc h2,.doc h3,.doc h4{font-size:18px;margin:14px 0 6px;line-height:1.3}
.doc>*:first-child{margin-top:0}
.doc p{margin:0 0 10px}
.doc ul,.doc ol{margin:0 0 10px;padding-left:22px}
.doc .tw{overflow-x:auto;margin:0 0 10px}
.doc table{border-collapse:collapse;font-size:14px}
.doc td,.doc th{border:.5px solid var(--sep);padding:6px 8px;vertical-align:top}
.doc img{max-width:100%;border-radius:8px}
.notes{background:var(--card);border-radius:12px;padding:14px 16px;font-size:16px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.preview-img{width:100%;border-radius:12px;display:block;background:var(--card)}

/* swipe rows */
.sw{position:relative;overflow:hidden}
.sw+.sw::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);border-top:.5px solid var(--sep);z-index:2}
.sw-act{position:absolute;top:0;bottom:0;right:0;display:flex;visibility:hidden}
.sw.on .sw-act{visibility:visible}
.sw-act button{width:80px;color:#fff;font-size:13px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.sw-act button svg{width:20px;height:20px}
.sw-act .e{background:var(--gray)}
.sw-act .d{background:var(--red)}
.sw-fg{position:relative;background:var(--card);transition:transform .28s cubic-bezier(.2,.9,.25,1);touch-action:pan-y;z-index:1}
.sw-fg.drag{transition:none}
.quick{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:none;gap:6px;z-index:3;background:var(--card);padding-left:6px}
.quick button{width:32px;height:32px;border-radius:8px;background:var(--fill);display:grid;place-items:center;color:var(--fg2)}
.quick button svg{width:16px;height:16px}
.quick button:hover{color:var(--accent)}
.quick .qd:hover{color:var(--red)}
@media (hover:hover) and (pointer:fine){.sw:hover .quick,.sw:focus-within .quick{display:flex}}
.toast.act{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:8px 8px 8px 18px}
.toast .undo{color:var(--accent);font-weight:600;font-size:15px;padding:6px 10px;border-radius:999px}
.toast .undo:active{background:var(--fill)}


/* hero (today) */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:18px 18px 16px;color:#fff;margin-top:6px;
  background:radial-gradient(120% 120% at 100% 0%,color-mix(in srgb,var(--accent2) 85%,transparent) 0%,transparent 55%),linear-gradient(155deg,var(--wine2) 0%,var(--wine1) 100%);
  box-shadow:0 18px 40px -18px rgba(211,48,78,.45);border:.5px solid rgba(255,120,145,.18)}
.hero .bgnum{position:absolute;right:-4px;top:-30px;font-family:var(--font-round);font-size:170px;font-weight:800;line-height:1;opacity:.08;pointer-events:none;letter-spacing:-.04em}
.hero .eb{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.78}
.hero .dt{font-size:36px;font-weight:700;line-height:1.08;margin:4px 0 4px;letter-spacing:.005em}
.hero .sum{font-size:15px;opacity:.82;margin-bottom:14px}
.hero .nx{display:block;width:100%;text-align:left;color:#fff;background:rgba(255,255,255,.12);border:.5px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hero .nx:active{background:rgba(255,255,255,.18)}
.hero .nx .c{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.82}
.hero .nx .t{font-size:18px;font-weight:600;margin-top:2px;overflow-wrap:anywhere}
.hero .nx .m{font-size:14px;opacity:.8;margin-top:1px}
.hero .prog{background:rgba(255,255,255,.22);margin-top:9px}

.spin{width:18px;height:18px;border:2px solid var(--fill2);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.confirm{display:flex;gap:10px}

<script>
(function(){
"use strict";
/* ---------- icons ---------- */
const I={
  today:'<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="6" width="19" height="17.5" rx="3.5"/><path d="M4.5 11h19M10 3.8v4M18 3.8v4"/><circle cx="14" cy="17.2" r="2.2" fill="currentColor" stroke="none"/></svg>',

  tasks:'<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="8.5" r="2.4"/><circle cx="7" cy="19.5" r="2.4"/><path d="M12.5 8.5h11M12.5 19.5h11"/></svg>',
  debt:'<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4.5 3.5 9.5 14 14.5l10.5-5z"/><path d="M8 12v5.2c0 1.6 2.7 3.3 6 3.3s6-1.7 6-3.3V12M24.5 9.5v6"/></svg>',
  plus:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 5 5-5 5"/></svg>',

  right:'<svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m2 2 8 8-8 8"/></svg>',
  tick:'<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m3 7.3 2.6 2.6L11 4.4"/></svg>',
  clip:'<svg class="clip" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M13 7.5 8 12.5a3.2 3.2 0 0 1-4.5-4.5l5.3-5.3a2.1 2.1 0 0 1 3 3L6.5 11a1 1 0 0 1-1.5-1.5L10 4.5"/></svg>',
  book:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5c2.5-1 5-1 7 .8 2-1.8 4.5-1.8 7-.8v11c-2.5-1-5-1-7 .8-2-1.8-4.5-1.8-7-.8z"/><path d="M10 5.3v11"/></svg>',
  list:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m3 6 1.6 1.6L7.5 4.7M3 13.5l1.6 1.6 2.9-2.9M10.5 6h6.5M10.5 13.5h6.5"/></svg>',
  todo:'<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="14" r="10"/><path d="m9.5 14.2 3 3 6-6.4"/></svg>',
  bell:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8.5a5 5 0 0 1 10 0c0 4 1.6 5.3 1.6 5.3H3.4S5 12.5 5 8.5zM8.3 16.6a1.9 1.9 0 0 0 3.4 0"/></svg>',
  rep:'<svg class="rep" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7A5 5 0 0 1 12 4.5L13.5 6M13.5 9A5 5 0 0 1 4 11.5L2.5 10M13.5 2.5V6H10M2.5 13.5V10H6"/></svg>',
  pen:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 3.5a2.1 2.1 0 0 1 3 3L7 16l-4 1 1-4z"/><path d="m12 5 3 3"/></svg>',
  trash:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 5.5h13M8 5.5V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.5M5 5.5l.8 10.6a1.5 1.5 0 0 0 1.5 1.4h5.4a1.5 1.5 0 0 0 1.5-1.4L15 5.5M8.3 9v5M11.7 9v5"/></svg>',
  cap:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5 2.5 7 10 10.5 17.5 7z"/><path d="M5.5 8.6v4c0 1.1 2 2.4 4.5 2.4s4.5-1.3 4.5-2.4v-4"/></svg>'
};

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const keyOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseKey=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const todayKey=()=>keyOf(new Date());
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d)};
const diffDays=(a,b)=>Math.round((parseKey(b)-parseKey(a))/864e5);
const mondayOf=k=>{const d=parseKey(k);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return keyOf(d)};
const fmtLong=k=>new Intl.DateTimeFormat("ru-RU",{weekday:"long",day:"numeric",month:"long"}).format(parseKey(k));
const fmtShort=k=>new Intl.DateTimeFormat("ru-RU",{day:"numeric",month:"short"}).format(parseKey(k)).replace(".","");
const fmtMonth=k=>new Intl.DateTimeFormat("ru-RU",{month:"long",year:"numeric"}).format(parseKey(k));
const WD=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const plural=(n,a,b,c)=>{const m10=n%10,m100=n%100;return n+" "+(m10===1&&m100!==11?a:m10>=2&&m10<=4&&(m100<10||m100>=20)?b:c)};
const relDay=k=>{if(!k)return"Без срока";const d=diffDays(todayKey(),k);if(d===0)return"Сегодня";if(d===1)return"Завтра";if(d===-1)return"Вчера";if(d>1&&d<7)return fmtLong(k).split(",")[0].replace(/^./,c=>c.toUpperCase());return fmtShort(k)};
const toMin=t=>{if(!t)return null;const [h,m]=t.split(":").map(Number);return h*60+m};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const fmtSize=b=>b<1024?b+" Б":b<1048576?Math.round(b/1024)+" КБ":(b/1048576).toFixed(1)+" МБ";
const PALETTE=["--accent","--orange","--green","--purple","--pink","--teal","--indigo","--red","--brown","--yellow"];
const subjColor=s=>{s=(s||"").trim().toLowerCase();if(!s)return"var(--fg3)";let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))>>>0;return"var("+PALETTE[h%PALETTE.length]+")"};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function toast(msg){const t=$("#toast");t.classList.remove("act");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2400)}
function toastAction(msg,label,fn){const t=$("#toast");t.innerHTML=`<span>${esc(msg)}</span><button class="undo">${esc(label)}</button>`;t.classList.add("act","show");
  t.querySelector(".undo").onclick=()=>{t.classList.remove("show","act");clearTimeout(toast._t);fn()};
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show","act"),6000)}

const LTYPES=[["lec","Лекция"],["prac","Практика"],["lab","Лаба"],["other","Другое"]];
const DKINDS=[["lab","Лаба"],["credit","Зачёт"],["exam","Экзамен"],["course","Курсовая"],["work","Работа"],["other","Другое"]];
const TKINDS=[["hw","Домашнее задание"],["lab","Лабораторная"],["essay","Реферат / доклад"],["test","Контрольная"],["course","Курсовая"],["other","Другое"]];
const DSTATUS=[["open","Не начат"],["wip","В работе"],["closed","Закрыт"]];
const lbl=(arr,v)=>(arr.find(x=>x[0]===v)||arr[arr.length-1])[1];

/* ---------- state ---------- */
const S={tab:"today",sel:todayKey(),taskSeg:"active",debtSeg:"open",lessons:[],tasks:[],debts:[],todos:[],todoSeg:"active",loaded:{lessons:false,tasks:false,debts:false,todos:false},sb:null,user:null,auth:"loading",authMode:"in",offline:!navigator.onLine};
try{const t=localStorage.getItem("pl.tab");if(t)S.tab=t}catch(e){}
if(["today","cal","todos","tasks","debts"].includes(location.hash.slice(1)))S.tab=location.hash.slice(1);

/* ---------- data layer (Supabase) ---------- */
const CFG=window.PLANNER_CONFIG||{};
const COLS=["lessons","tasks","debts","todos"];
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let outbox=LS.get("pl.outbox",[]);
function markLoaded(){S.loaded={lessons:true,tasks:true,debts:true,todos:true}}
let rq=0;function scheduleRender(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;render()})}
(function(){const c=LS.get("pl.cache",null);if(c){COLS.forEach(k=>{S[k]=c[k]||[]});markLoaded()}})();
let persistT=0;function persist(){clearTimeout(persistT);persistT=setTimeout(()=>LS.set("pl.cache",{lessons:S.lessons,tasks:S.tasks,debts:S.debts,todos:S.todos}),250)}
function applyLocal(col,id,data){
  if(!COLS.includes(col))return;const arr=S[col];const i=arr.findIndex(x=>x.id===id);
  if(data===null){if(i>-1)arr.splice(i,1)}else{const o=Object.assign({},data,{id});if(i>-1)arr[i]=o;else arr.push(o)}
  persist();scheduleRender();
}
async function init(){
  render();
  const hasCfg=CFG.supabaseUrl&&CFG.supabaseKey&&!/ВСТАВЬ/.test(CFG.supabaseUrl+CFG.supabaseKey);
  if(!hasCfg){S.auth="noconfig";render();return}
  if(!window.supabase){S.auth="nolib";render();return}
  try{S.sb=window.supabase.createClient(CFG.supabaseUrl.trim(),CFG.supabaseKey.trim(),{auth:{persistSession:true,autoRefreshToken:true,storageKey:"pl.auth"}})}
  catch(e){S.auth="noconfig";render();return}
  S.sb.auth.onAuthStateChange((ev,session)=>{
    S.user=session?session.user:null;S.auth=S.user?"in":"out";
    if(S.user)setTimeout(start,0);render();
  });
}
let startedFor=null,channel=null;
async function start(){
  if(!S.user||startedFor===S.user.id)return;startedFor=S.user.id;
  if(LS.get("pl.owner",null)!==S.user.id){COLS.forEach(k=>S[k]=[]);outbox=[];LS.set("pl.outbox",[]);LS.set("pl.owner",S.user.id);S.loaded={lessons:false,tasks:false,debts:false,todos:false};render()}
  await fetchAll();subscribe();flush();
}
async function fetchAll(){
  if(!S.sb||!S.user)return;
  if(!navigator.onLine){markLoaded();render();return}
  const all=[];let from=0,ok=true;
  while(true){
    const {data,error}=await S.sb.from("items").select("id,col,data").in("col",COLS).range(from,from+999);
    if(error){ok=false;toast("Не удалось загрузить данные: "+error.message);break}
    all.push(...data);if(data.length<1000)break;from+=1000;
  }
  if(ok){
    const next={lessons:[],tasks:[],debts:[],todos:[]};
    all.forEach(r=>{if(next[r.col])next[r.col].push(Object.assign({},r.data,{id:r.id}))});
    COLS.forEach(k=>S[k]=next[k]);
    outbox.forEach(o=>applyLocal(o.col,o.id,o.op==="del"?null:o.data));
  }
  markLoaded();persist();render();
}
function subscribe(){
  if(channel)S.sb.removeChannel(channel);
  channel=S.sb.channel("items-"+S.user.id).on("postgres_changes",{event:"*",schema:"public",table:"items"},p=>{
    if(p.eventType==="DELETE"){const id=p.old&&p.old.id;if(id)COLS.forEach(c=>{if(S[c].some(x=>x.id===id))applyLocal(c,id,null)});return}
    const r=p.new;if(!r||!COLS.includes(r.col))return;
    if(outbox.some(o=>o.id===r.id))return;
    applyLocal(r.col,r.id,r.data);
  }).subscribe();
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.user&&navigator.onLine){fetchAll();flush()}});
window.addEventListener("online",()=>{S.offline=false;render();if(S.user){flush().then(fetchAll)}});
window.addEventListener("offline",()=>{S.offline=true;render()});
let flushing=false;
async function flush(){
  if(flushing||!S.sb||!S.user||!navigator.onLine)return;flushing=true;
  try{
    while(outbox.length){
      const o=outbox[0];let res;
      try{
        if(o.op==="del")res=await S.sb.from("items").delete().eq("id",o.id);
        else res=await S.sb.from("items").upsert({id:o.id,col:o.col,data:o.data,updated_at:new Date().toISOString()});
      }catch(e){break}
      if(res.error){if(/fetch|network|Failed/i.test(res.error.message||""))break;toast("Не сохранилось: "+res.error.message)}
      outbox.shift();LS.set("pl.outbox",outbox);
    }
  }finally{flushing=false}
  scheduleRender();
}
function enqueue(o){outbox=outbox.filter(x=>x.id!==o.id);outbox.push(o);LS.set("pl.outbox",outbox);flush()}
async function save(col,id,data){applyLocal(col,id,data);enqueue({op:"up",col,id,data})}
async function patch(col,id,partial){const cur=S[col].find(x=>x.id===id);if(!cur)return;const d=Object.assign({},cur,partial);delete d.id;save(col,id,d)}
async function del(col,id){applyLocal(col,id,null);enqueue({op:"del",col,id})}
async function putFileItem(id,data){const {error}=await S.sb.from("items").upsert({id,col:"files",data});if(error)throw new Error("Не удалось сохранить файл: "+error.message)}
async function getFileItem(id){const {data,error}=await S.sb.from("items").select("data").eq("id",id).maybeSingle();if(error)throw error;return data&&data.data}
async function uploadFile(path,file,type){
  const {error}=await S.sb.storage.from("attachments").upload(path,file,{contentType:type||file.type||"application/octet-stream",upsert:true});
  if(error)throw new Error(/exceed|size|large/i.test(error.message)?"Файл слишком большой":"Не удалось загрузить "+file.name+": "+error.message);
}
async function signedUrl(path,download){const {data,error}=await S.sb.storage.from("attachments").createSignedUrl(path,3600,download?{download}:undefined);if(error)throw error;return data.signedUrl}
function openUrl(u){const a=document.createElement("a");a.href=u;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove()}

/* ---------- auth ---------- */
function viewAuth(){
  if(S.auth==="loading")return `<h1 class="large">Планер</h1><p class="subtitle"><span class="spin"></span>&nbsp; Загружаю…</p>`;
  if(S.auth==="noconfig")return `<h1 class="large">Почти готово</h1><div class="empty" style="text-align:left"><b>Не вписаны ключи базы</b>Открой файл <code>config.js</code> в репозитории на GitHub и вставь адрес проекта и ключ из Supabase. Это шаг 4 инструкции. Через минуту после сохранения обнови страницу.</div>`;
  if(S.auth==="nolib")return `<h1 class="large">Нет связи</h1><div class="empty"><b>Нужен интернет для первого запуска</b>Подключись к сети и открой приложение снова. Дальше оно будет открываться и без интернета.</div>`;
  const up=S.authMode==="up";
  return `<h1 class="large">Планер</h1><p class="subtitle">${up?"Создай аккаунт один раз. Потом входи с этой почтой на телефоне и на ПК.":"Войди, чтобы увидеть свои пары, задачи и хвосты."}</p>
  <form class="auth" id="authForm" novalidate>
    <div class="seg" role="group" aria-label="Режим"><button type="button" data-am="in" aria-pressed="${!up}">Вход</button><button type="button" data-am="up" aria-pressed="${up}">Регистрация</button></div>
    <div class="f">
      <div class="fr full"><input id="a-email" type="email" autocomplete="email" inputmode="email" placeholder="Почта" required></div>
      <div class="fr full"><input id="a-pass" type="password" autocomplete="${up?"new-password":"current-password"}" placeholder="${up?"Пароль, минимум 6 символов":"Пароль"}" required minlength="6"></div>
    </div>
    <p class="err" id="a-err" role="alert"></p>
    <button class="bigbtn" type="submit" id="a-go">${up?"Создать аккаунт":"Войти"}</button>
  </form>`;
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-am]");if(!b)return;S.authMode=b.dataset.am;render()});
document.addEventListener("submit",async e=>{
  if(e.target.id!=="authForm")return;e.preventDefault();
  const email=$("#a-email").value.trim(),password=$("#a-pass").value,err=$("#a-err"),go=$("#a-go");
  err.textContent="";
  if(!email||!password){err.textContent="Впиши почту и пароль";return}
  if(password.length<6){err.textContent="Пароль должен быть не короче 6 символов";return}
  go.disabled=true;
  try{
    if(S.authMode==="up"){
      const {data,error}=await S.sb.auth.signUp({email,password});
      if(error)throw error;
      if(!data.session){err.style.color="var(--fg2)";err.textContent="Аккаунт создан, но Supabase ждёт подтверждения почты. Открой письмо и нажми ссылку, или отключи подтверждение (шаг 3 инструкции) и войди."}
    }else{
      const {error}=await S.sb.auth.signInWithPassword({email,password});
      if(error)throw error;
    }

function parseQuick(txt){
  let title=txt.trim(),date=todayKey(),time="";
  const tm=title.match(/(?:^|\s)(?:в\s+)?([01]?\d|2[0-3])[:.]([0-5]\d)(?=\s|$)/i);
  if(tm){time=pad(+tm[1])+":"+tm[2];title=title.replace(tm[0]," ")}
  if(/(^|\s)послезавтра(?=\s|$)/i.test(title)){date=addDays(todayKey(),2);title=title.replace(/(^|\s)послезавтра(?=\s|$)/i," ")}
  else if(/(^|\s)завтра(?=\s|$)/i.test(title)){date=addDays(todayKey(),1);title=title.replace(/(^|\s)завтра(?=\s|$)/i," ")}
  else if(/(^|\s)сегодня(?=\s|$)/i.test(title)){title=title.replace(/(^|\s)сегодня(?=\s|$)/i," ")}
  title=title.replace(/\s+/g," ").trim();
  title=title.charAt(0).toUpperCase()+title.slice(1);
  return {title,date,time};
}

const CAN_ICS=!!window.PLANNER_CONFIG;
function icsFor(t){
  const e=x=>String(x||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
  const dt=t.date.replace(/-/g,"")+"T"+t.time.replace(":","")+"00";
  const rr=t.repeat==="daily"?"RRULE:FREQ=DAILY":t.repeat==="weekly"?"RRULE:FREQ=WEEKLY":t.repeat==="weekdays"?"RRULE:FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR":"";
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Planer//RU","CALSCALE:GREGORIAN","METHOD:PUBLISH","BEGIN:VEVENT","UID:"+t.id+"@planer","DTSTAMP:"+stamp,"DTSTART:"+dt,"DURATION:PT15M","SUMMARY:"+e(t.title),t.notes?"DESCRIPTION:"+e(t.notes):"",rr,"BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+e(t.title),"TRIGGER:PT0M","END:VALARM","END:VEVENT","END:VCALENDAR"].filter(Boolean).join("\r\n")+"\r\n";
}

}

let mammothP=null;
function loadMammoth(){
  if(window.mammoth)return Promise.resolve(window.mammoth);
  if(mammothP)return mammothP;
  const srcs=["https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js","https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js"];
  mammothP=new Promise((res,rej)=>{let i=0;const next=()=>{if(i>=srcs.length){mammothP=null;rej(new Error("load"));return}const sc=document.createElement("script");sc.src=srcs[i++];sc.onload=()=>window.mammoth?res(window.mammoth):next();sc.onerror=next;document.head.appendChild(sc)};next()});
  return mammothP;
}
const ALLOWED={P:"p",H1:"h3",H2:"h3",H3:"h4",H4:"h4",H5:"h4",H6:"h4",UL:"ul",OL:"ol",LI:"li",STRONG:"strong",B:"strong",EM:"em",I:"em",U:"u",BR:"br",TABLE:"table",TBODY:"tbody",THEAD:"thead",TR:"tr",TD:"td",TH:"th",SUP:"sup",SUB:"sub"};
function sanitize(html){
  const src=new DOMParser().parseFromString("<div>"+html+"</div>","text/html").body.firstChild;
  const out=document.createElement("div");
  (function walk(from,to){for(const n of from.childNodes){
    if(n.nodeType===3){to.appendChild(document.createTextNode(n.nodeValue));continue}
    if(n.nodeType!==1)continue;const tag=ALLOWED[n.tagName];
    if(!tag){walk(n,to);continue}
    const el=document.createElement(tag);
    if((tag==="td"||tag==="th")){for(const a of["colspan","rowspan"]){const v=parseInt(n.getAttribute(a),10);if(v>1&&v<50)el.setAttribute(a,v)}}
    if(tag==="table"){const w=document.createElement("div");w.className="tw";w.appendChild(el);to.appendChild(w)}else to.appendChild(el);
    walk(n,el);
  }})(src,out);
  out.querySelectorAll("p").forEach(p=>{if(!p.textContent.trim()&&!p.querySelector("br"))p.remove()});
  return out.innerHTML;
}
const b64enc=buf=>{const u=new Uint8Array(buf);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const b64dec=s=>{const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u};
const extOf=n=>(n.split(".").pop()||"").toLowerCase();
const FILECOL={docx:"#2B579A",pdf:"#E5252A",img:"#34C759",txt:"#8E8E93"};
function kindOf(f){const e=extOf(f.name);if(e==="docx")return"docx";if(e==="pdf"||f.type==="application/pdf")return"pdf";if(/^image\//.test(f.type)||["jpg","jpeg","png","heic","webp","gif"].includes(e))return"img";if(["txt","md"].includes(e))return"txt";if(e==="doc")return"doc";return"other"}
async function processFile(f){
  const kind=kindOf(f);
  if(kind==="doc")throw new Error("Старый формат .doc не читается. Пересохрани файл как .docx");
  if(kind==="other")throw new Error("Этот тип файла не поддерживается: "+f.name);
  if(!S.sb||!S.user)throw new Error("Сначала войди в аккаунт");
  if(!navigator.onLine)throw new Error("Чтобы прикрепить файл, нужен интернет");
  const id=uid();const ext=(extOf(f.name)||"bin").replace(/[^a-z0-9]/g,"")||"bin";const path=S.user.id+"/"+id+"/file."+ext;
  if(kind==="docx"){
    const buf=await f.arrayBuffer();let html="",text="";
    try{const m=await loadMammoth();const r=await m.convertToHtml({arrayBuffer:buf});html=sanitize(r.value);const tmp=document.createElement("div");tmp.innerHTML=html;text=tmp.textContent}
    catch(e){throw new Error("Не удалось прочитать "+f.name)}
    if(html.length>400000)html=html.slice(0,400000);
    await uploadFile(path,f,"application/vnd.openxmlformats-officedocument.wordprocessingml.document");
    await putFileItem(id,{name:f.name,kind,size:f.size,html,path,createdAt:Date.now()});
    return {meta:{id,kind,name:f.name,size:f.size,path,orig:true},text};
  }
  if(kind==="txt"){
    const text=(await f.text()).slice(0,400000);
    await putFileItem(id,{name:f.name,kind,size:f.size,text,createdAt:Date.now()});
    return {meta:{id,kind,name:f.name,size:f.size},text};
  }
  let type=f.type;if(kind==="pdf")type="application/pdf";if(kind==="img"&&!type)type=ext==="png"?"image/png":"image/jpeg";
  await uploadFile(path,f,type);
  return {meta:{id,kind,name:f.name,size:f.size,path},text:""};
}
async function removeAttachment(m){
  try{if(m.path)await S.sb.storage.from("attachments").remove([m.path]);if(m.kind==="docx"||m.kind==="txt")await S.sb.from("items").delete().eq("id",m.id)}catch(e){}
}
function attRow(m,editable){
  const lab=m.kind==="docx"?"DOCX":m.kind==="pdf"?"PDF":m.kind==="img"?"ФОТО":"TXT";
  return `<div class="att" data-att="${esc(m.id)}"><span class="fi" style="background:${FILECOL[m.kind]||"#8E8E93"}">${lab}</span><span class="main"><div class="nm">${esc(m.name)}</div><div class="sz">${fmtSize(m.size||0)}${m.kind==="docx"&&!m.orig?" · сохранён текст":""}</div></span>${editable?`<button class="x" data-rm="${esc(m.id)}">Убрать</button>`:""}</div>`;

/* attachment editor bound to a sheet */
function attEditor(sheetObj,files,onText){
  const box=document.createElement("div");box.className="grp";
  box.innerHTML=`<p class="cap-h">Файлы задания</p><div class="f" data-list></div><label class="drop" style="margin-top:8px;display:block" tabindex="0"><input type="file" accept=".docx,.pdf,.txt,.md,image/*" multiple><b>Прикрепить файл</b><br>.docx, PDF, фото или .txt${window.matchMedia("(pointer:fine)").matches?". Можно перетащить сюда":""}</label><p class="hint">Под каждым файлом можно подписать, что это, и оставить пояснения. Текст из .docx сохраняется прямо в задаче, поэтому на телефоне задание читается без скачивания.</p>`;
  const listEl=box.querySelector("[data-list]");const drop=box.querySelector(".drop");const inp=drop.querySelector("input");
  const added=[];const removed=[];
  const paint=()=>{listEl.innerHTML=files.map(m=>`<div class="attw" data-att="${esc(m.id)}">${attRow(m,true)}
    <div class="fr full"><input data-f="label" placeholder="Что это за файл (напр. Вариант 7, задание к ЛР3)" value="${esc(m.label||"")}" autocomplete="off" aria-label="Описание файла"></div>
    <div class="fr full"><textarea data-f="note" placeholder="Пояснения к файлу: что делать, на что обратить внимание" aria-label="Пояснения к файлу">${esc(m.note||"")}</textarea></div></div>`).join("");listEl.hidden=!files.length};
  paint();
  listEl.addEventListener("input",e=>{const f=e.target.dataset.f;if(!f)return;const w=e.target.closest("[data-att]");const m=files.find(x=>x.id===w.dataset.att);if(m)m[f]=e.target.value.trim()});
  listEl.addEventListener("click",e=>{const b=e.target.closest("[data-rm]");if(!b)return;const i=files.findIndex(m=>m.id===b.dataset.rm);if(i>-1){removed.push(files[i]);files.splice(i,1);paint()}});
  async function take(list){
    for(const f of list){
      const row=document.createElement("div");row.className="att";row.innerHTML=`<span class="spin"></span><span class="main"><div class="nm">${esc(f.name)}</div><div class="sz">Загружаю…</div></span>`;listEl.hidden=false;listEl.appendChild(row);
      try{const r=await processFile(f);files.push(r.meta);added.push(r.meta);if(onText)onText(r,f);}catch(err){toast(err.message)}
      paint();
    }
  }
  inp.onchange=()=>{take([...inp.files]);inp.value=""};
  drop.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();inp.click()}});
  ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();drop.classList.add("over")}));
  ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();drop.classList.remove("over")}));
  drop.addEventListener("drop",e=>take([...e.dataTransfer.files]));
  box.take=take;
  box.finish=async saved=>{if(saved){for(const m of removed)await removeAttachment(m)}else{for(const m of added)await removeAttachment(m)}};
  sheetObj.body.appendChild(box);
  return box;
}
function guessTitle(text,name){
  const lines=(text||"").split(/\n+/).map(s=>s.trim()).filter(s=>s.length>3);
  const first=lines[0]||"";
  if(first&&first.length<=90)return first;
  return name.replace(/\.[^.]+$/,"").replace(/[_]+/g," ");
}

  <div class="grp"><div class="f"><div class="fr full"><textarea id="f-notes" placeholder="Что нужно сделать, когда консультации, условия допуска">${esc(d.notes||"")}</textarea></div></div></div>`;
  let editor;
  const s=sheet({title:isNew?"Новый хвост":"Изменить хвост",right:isNew?"Добавить":"Готово",body,
    onClose:saved=>editor&&editor.finish(saved),
    onRight:async s=>{const r=s.body;const subject=val(r,"f-subject");
      if(!subject){toast("Впиши предмет");r.querySelector("#f-subject").focus();return false}
      const st=segVal(r,"st")||"open";
      const data={subject,title:val(r,"f-title"),kind:val(r,"f-kind"),deadline:val(r,"f-deadline"),teacher:val(r,"f-teacher"),status:st,notes:val(r,"f-notes"),files,createdAt:d.createdAt||Date.now(),updatedAt:Date.now(),closedAt:st==="closed"?(d.closedAt||Date.now()):null};
      await save("debts",isNew?uid():d.id,data);toast(isNew?"Хвост добавлен":"Сохранено")}});
  wireSeg(s.body);
  editor=attEditor(s,files,(r,f)=>{const ti=s.body.querySelector("#f-title");if(!ti.value.trim())ti.value=guessTitle(r.text,f.name)});
  if(!isNew){const x=document.createElement("div");x.className="grp";x.innerHTML=`<button class="danger">Удалить хвост</button>`;s.body.appendChild(x);
    x.querySelector("button").onclick=()=>confirmIn(s,"Удалить хвост вместе с файлами?",async()=>{for(const m of d.files||[])await removeAttachment(m);await del("debts",d.id);closeSheet(true,true);toast("Удалено")})}
}
function debtDetail(d){
  const body=document.createElement("div");body.style.display="contents";const st=d.status||"open";
  const rows=[["Предмет",`<span class="dot" style="background:${subjColor(d.subject)}"></span>${esc(d.subject||"—")}`],["Тип",esc(lbl(DKINDS,d.kind))],["Сдать до",d.deadline?esc(fmtLong(d.deadline)):"Не указано"]];
  if(d.teacher)rows.push(["Кому",esc(d.teacher)]);
  body.innerHTML=`<div class="dhead"><h3>${esc(d.title||lbl(DKINDS,d.kind))}</h3></div>
  <div class="grp"><div class="list">${rows.map(([a,b])=>`<div class="row"><span class="main">${a}</span><span class="end" style="white-space:normal;text-align:right">${b}</span></div>`).join("")}</div></div>
  <div class="grp"><p class="cap-h">Статус</p><div class="f"><div class="fr col">${segHTML("st",DSTATUS,st)}</div></div></div>
  ${d.notes?`<div class="grp"><p class="cap-h">Заметки</p><div class="notes">${esc(d.notes)}</div></div>`:""}`;
  const s=sheet({title:"Хвост",left:"Закрыть",right:"Изменить",body,onRight:async()=>{setTimeout(()=>debtForm(S.debts.find(x=>x.id===d.id)||d),10)}});
  s.body.querySelector(".seg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;s.body.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));
    patch("debts",d.id,{status:b.dataset.v,closedAt:b.dataset.v==="closed"?Date.now():null});d.status=b.dataset.v;if(b.dataset.v==="closed")toast("Хвост закрыт 🎉")});
  const dz=document.createElement("div");dz.className="grp";dz.innerHTML=`<button class="danger">Удалить хвост</button>`;s.body.appendChild(dz);
  dz.querySelector("button").onclick=()=>{closeSheet();removeWithUndo("debts",d.id)};
  if((d.files||[]).length&&S.sb){const h=document.createElement("div");h.style.display="contents";s.body.insertBefore(h,dz);renderAttachmentsDetail(h,d.files)}
}

/* ---------- global drop & picker → new task ---------- */
let dragDepth=0;
const hasFiles=e=>e.dataTransfer&&[...(e.dataTransfer.types||[])].includes("Files");
window.addEventListener("dragenter",e=>{if(!hasFiles(e)||openSheet)return;e.preventDefault();dragDepth++;$("#dropall").classList.add("show")});
window.addEventListener("dragover",e=>{if(hasFiles(e))e.preventDefault()});
window.addEventListener("dragleave",e=>{if(!hasFiles(e)||openSheet)return;dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)$("#dropall").classList.remove("show")});
window.addEventListener("drop",e=>{if(!hasFiles(e))return;e.preventDefault();dragDepth=0;$("#dropall").classList.remove("show");if(openSheet)return;
  const fs=[...e.dataTransfer.files];if(!fs.length)return;if(S.tab==="debts")debtFormWith(fs);else taskForm(null,fs)});
$("#globalFile").onchange=e=>{const fs=[...e.target.files];e.target.value="";if(fs.length)taskForm(null,fs)};
function debtFormWith(fs){debtForm(null);const box=openSheet.body.querySelector(".drop")?.closest(".grp");if(box&&box.take)box.take(fs)}

/* ---------- export / import ---------- */
function exportAll(){
  const data={app:"planer",exportedAt:new Date().toISOString(),lessons:S.lessons,tasks:S.tasks,debts:S.debts,todos:S.todos};
  const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
  const a=document.createElement("a");a.href=url;a.download="planer-backup-"+todayKey()+".json";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);toast("Копия сохранена");
}
$("#importFile").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{
    const j=JSON.parse(await f.text());let n=0;
    for(const col of COLS){for(const it of (Array.isArray(j[col])?j[col]:[])){if(!it||typeof it!=="object")continue;const id=String(it.id||uid()).replace(/[^A-Za-z0-9_\-.~:@+]/g,"")||uid();const d=Object.assign({},it);delete d.id;save(col,id,d);n++}}
    toast(n?"Загружено записей: "+n:"В файле нет записей");
  }catch(err){toast("Это не файл резервной копии")}
};

if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
init();
})();
</script>
